[package]
name = "native-wallet-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["multicore"]
multicore = ["native-payments/multicore", "orchard/multicore"]

[dependencies]
native-payments = { path = "../../protocol/payments", default-features = false }
orchard.workspace = true
incrementalmerkletree.workspace = true
blake2b_simd.workspace = true
rand.workspace = true
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
solana-pubkey = { version = "=3.0.0", features = ["curve25519", "sha2"] }
solana-transaction = { version = "=3.0.0", features = ["verify", "serde"] }

[dev-dependencies]
serde_json = "1"
solana-keypair = "=3.0.0"
solana-message = "=3.0.0"
solana-instruction = "=3.0.0"
solana-signer = "=3.0.0"
