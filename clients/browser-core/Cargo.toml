[package]
name = "zolana-browser-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "browser_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "browser-core-check"
path = "src/bin/check.rs"

[[bin]]
name = "browser-vault-check"
path = "src/bin/vault_check.rs"

[features]
default = []
# Native parity may exercise the old native threading configuration separately.
native-multicore = ["native-payments/multicore", "native-wallet-core/multicore", "orchard/multicore"]
# Separate opt-in browser artifact: requires shared Wasm memory, atomics,
# cross-origin isolation and initThreadPool() before any proof operation.
browser-multicore = ["dep:wasm-bindgen-rayon", "native-payments/multicore", "native-wallet-core/multicore", "orchard/multicore"]

[dependencies]
native-payments = { path = "../../protocol/payments", default-features = false }
native-wallet-seed = { path = "../wallet-seed" }
native-wallet-core = { path = "../wallet-core", default-features = false }
base64 = "=0.22.1"
bincode = "1.3.3"
chacha20poly1305 = "=0.11.0"
solana-pubkey = { version = "=3.0.0", features = ["curve25519", "sha2"] }
solana-transaction = { version = "=3.0.0", features = ["verify", "serde"] }
orchard.workspace = true
incrementalmerkletree.workspace = true
blake2b_simd.workspace = true
rand.workspace = true
bs58 = "0.5"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "std", "zeroize"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen-rayon = { version = "=1.3.0", optional = true, features = ["no-bundler"] }

[dev-dependencies]
solana-instruction = "=3.0.0"
solana-keypair = "=3.0.0"
solana-message = "=3.0.0"
solana-signer = "=3.0.0"
