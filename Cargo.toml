[workspace]
members = ["protocol/payments", "clients/cli", "clients/wallet", "node/adapter", "node/validator-check", "node/localnet", "node/rpc-access"]
exclude = ["node/agave"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
orchard = "=0.16.0"
blake2b_simd = "1"
rand = { version = "0.10", features = ["sys_rng"] }
incrementalmerkletree = "0.9"

[profile.test]
opt-level = 2
debug = 0
incremental = false

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Proof construction includes generic code instantiated in the wallet crate.
# Keep local wallet runs representative of optimized cryptographic execution.
[profile.dev.package.native-wallet]
opt-level = 2

# Separate, bounded release candidate; never replaces local debug artifacts.
[profile.wallet-release]
inherits = "release"
opt-level = 2
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1
lto = false

[patch.crates-io]
# Match the imported validator's concurrency and QUIC fixes.
crossbeam-epoch = { git = "https://github.com/anza-xyz/crossbeam", rev = "fd279d707025f0e60951e429bf778b4813d1b6bf" }
quinn = { git = "https://github.com/anza-xyz/quinn", rev = "fc4decb0cf79b1b210603294e96849d67e9c22e2" }
quinn-proto = { git = "https://github.com/anza-xyz/quinn", rev = "fc4decb0cf79b1b210603294e96849d67e9c22e2" }
