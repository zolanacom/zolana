[workspace]
members = ["protocol/payments", "clients/cli", "node/adapter", "node/validator-check"]
exclude = ["node/agave"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
orchard = "=0.16.0"
blake2b_simd = "1"
rand = { version = "0.10", features = ["sys_rng"] }
incrementalmerkletree = "0.9"

[profile.test]
opt-level = 2
debug = 0
incremental = false

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2
