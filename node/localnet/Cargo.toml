[package]
name = "native-localnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Select the exact patched networking/concurrency revisions used by upstream.
quinn = "=0.11.8"
quinn-proto = "=0.11.12"
crossbeam-epoch = "=0.9.5"
crossbeam-deque = "=0.8.2"
agave-validator = { path = "../agave/validator", default-features = false }
solana-core = { path = "../agave/core" }
native-payment-program = { path = "../adapter" }
native-payments = { path = "../../protocol/payments" }
native-wallet = { path = "../../clients/wallet" }
bincode = "1.3.3"
payment-lab = { path = "../../clients/cli" }
solana-runtime = { path = "../agave/runtime" }
solana-genesis-utils = { path = "../agave/genesis-utils" }
solana-ledger = { path = "../agave/ledger" }
solana-account = "=3.0.0"
solana-pubkey = "=3.0.0"
solana-instruction = "=3.0.0"
solana-keypair = "=3.0.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.0"
solana-compute-budget-interface = "=3.0.0"
solana-genesis-config = "=3.0.0"
solana-feature-gate-interface = { version = "=3.0.0", features = ["bincode"] }
solana-sdk-ids = "=3.0.0"
solana-shred-version = "=3.0.0"
solana-hard-forks = "=3.0.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-cluster-type = "=3.0.0"
solana-fee-calculator = "=3.0.0"
solana-rent = "=3.0.0"
solana-epoch-schedule = "=3.0.0"
solana-commitment-config = "=3.0.0"
solana-rpc-client = { path = "../agave/rpc-client" }
solana-rpc-client-api = { path = "../agave/rpc-client-api" }
solana-transaction-error = "=3.0.0"
serde_json = "1"
blake2b_simd.workspace = true

# Keep the validator SDK types aligned with the imported release lockfile.
